name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    env:
      E2E_USER: e2e@test.local
      E2E_PASSWORD: e2e-test-password-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Resolves the Supabase preview branch that the Supabase GitHub App creates
      # automatically when this PR is opened. Fails loudly (set -e + jq -e) if the
      # branch isn't ready yet — re-run the job after ~1 min to give the App time
      # to provision it. No fallback to production credentials.
      #
      # Required repo secrets (Settings → Secrets and variables → Actions):
      #   SUPABASE_ACCESS_TOKEN  — generate at supabase.com/dashboard/account/tokens
      #   SUPABASE_PROJECT_ID    — the project ref (e.g. nmytkebeywruhzehohcb)
      - name: Resolve Supabase preview branch
        id: supabase
        run: |
          set -euo pipefail
          BRANCH=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_ID }}/branches" \
            | jq -e --arg b "${{ github.head_ref }}" \
              'map(select(.git_branch == $b)) | first // error("no preview branch for \($b)")')
          PREVIEW_REF=$(echo "$BRANCH" | jq -r '.ref')

          KEYS=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/${PREVIEW_REF}/api-keys")
          ANON=$(echo "$KEYS" | jq -er '.[] | select(.name == "anon") | .api_key')
          SERVICE=$(echo "$KEYS" | jq -er '.[] | select(.name == "service_role") | .api_key')

          URL="https://${PREVIEW_REF}.supabase.co"
          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ANON"
          echo "::add-mask::$SERVICE"
          echo "anon=$ANON"       >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "Resolved preview branch: $PREVIEW_REF"

      # Preview branches start with an empty auth.users table. Seed the E2E test
      # user via the Auth Admin API using the service_role key so it bypasses email
      # confirmation and is immediately usable by Playwright's global setup.
      - name: Seed E2E test user on preview branch
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "apikey: ${{ steps.supabase.outputs.service }}" \
            -H "Authorization: Bearer ${{ steps.supabase.outputs.service }}" \
            -H "Content-Type: application/json" \
            "${{ steps.supabase.outputs.url }}/auth/v1/admin/users" \
            -d "{\"email\":\"${E2E_USER}\",\"password\":\"${E2E_PASSWORD}\",\"email_confirm\":true}"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Write .env.local for runtime server
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.supabase.outputs.anon }}
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          EOF

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
